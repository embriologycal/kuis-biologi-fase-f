<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari Belajar - Tarik Tambang</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #eef7ee; 
            font-family: 'Patrick Hand', cursive;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #1a2e1a; overflow: hidden; position: relative;
        }
        
        /* Latar Belakang Biologi */
        .bio-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; opacity: 0.1;
            font-family: 'Permanent Marker', cursive; font-size: 3rem; color: #2e7d32; pointer-events: none;
        }
        .floating-element { position: absolute; animation: float 10s infinite ease-in-out alternate; }
        @keyframes float { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-30px) rotate(15deg); } }
        .el-1 { top: 10%; left: 10%; } .el-2 { top: 20%; right: 15%; animation-delay: 2s; }
        .el-3 { bottom: 15%; left: 15%; animation-delay: 1s; } .el-4 { bottom: 25%; right: 10%; animation-delay: 3s; }

        /* Header Kontrol */
        .top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 10; }
        .icon-btn {
            background-color: white; border: 3px solid #1b5e20; border-radius: 50%; 
            width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 2px 2px 0px #81c784; transition: all 0.2s ease;
        }
        .icon-btn:hover { background-color: #e8f5e9; transform: translateY(-2px); }

        /* Kontainer Halaman */
        .page-section { display: none; width: 100%; justify-content: center; align-items: center; height: 100vh; overflow-y: auto; }
        .page-section.active { display: flex; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* (Menu & Setup CSS disederhanakan agar fokus ke Game) */
        .container-main, .container-arena, .setup-box { 
            background: rgba(255,255,255,0.95); border: 4px solid #1b5e20; border-radius: 20px; 
            padding: 30px; width: 90%; max-width: 600px; box-shadow: 8px 8px 0 #81c784; text-align: center;
        }
        .title { font-family: 'Permanent Marker', cursive; font-size: 3rem; color: #1b5e20; margin-bottom: 20px; }
        .btn { width: 100%; padding: 15px; margin-bottom: 15px; font-family: 'Patrick Hand', cursive; font-size: 1.8rem; font-weight: bold; background: #fff; border: 3px solid #1b5e20; border-radius: 8px; cursor: pointer; }
        .btn-play { border-color: #6a1b9a; color: #6a1b9a; background: #f3e5f5; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { font-size: 1.2rem; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; font-family: 'Patrick Hand', cursive; font-size: 1.2rem; border: 2px solid #81c784; border-radius: 8px; }
        .timer-options { display: flex; gap: 10px; flex-wrap: wrap; }
        .timer-btn { padding: 8px 15px; border: 2px solid #81c784; border-radius: 8px; cursor: pointer; font-family: 'Patrick Hand'; font-size: 1.2rem; }
        .timer-btn.selected { background: #1b5e20; color: white; }

        /* ================= DESAIN GAME TARIK TAMBANG BARU ================= */
        .game-container-tt {
            width: 95%; max-width: 1300px; height: 95vh; display: flex; flex-direction: column; z-index: 1; position: relative;
        }

        /* Timer di Atas */
        .timer-display {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            font-family: 'Permanent Marker', cursive; font-size: 2.5rem; color: #d32f2f;
            background-color: rgba(255, 255, 255, 0.95); padding: 5px 30px; border-radius: 20px;
            border: 3px solid #d32f2f; box-shadow: 0 4px 0 #b71c1c; z-index: 20;
        }

        /* Area Tarik Tambang */
        .tug-of-war-area {
            flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-start;
            position: relative; border: 4px solid #006064; border-radius: 20px;
            background: linear-gradient(to right, #ffebee 50%, #e3f2fd 50%); /* Latar kiri merah muda, kanan biru muda */
            overflow: hidden; margin-top: 50px; margin-bottom: 20px;
        }

        /* Garis Tengah Arena */
        .center-line {
            position: absolute; top: 0; bottom: 0; left: 50%; width: 4px;
            background-color: rgba(0,0,0,0.2); border-right: 2px dashed #333; transform: translateX(-50%); z-index: 1;
        }

        /* Container Tali DNA */
        .rope-container {
            position: absolute; top: 40%; left: 0; width: 100%; height: 60px;
            transform: translateY(-50%); display: flex; align-items: center; justify-content: center;
            z-index: 2; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dna-rope {
            width: 100%; height: 100%; 
            /* Membuat pola tali menyerupai DNA menggunakan gradient bergelombang */
            background-image: repeating-linear-gradient(45deg, #1b5e20 0, #1b5e20 10px, transparent 10px, transparent 20px),
                              repeating-linear-gradient(-45deg, #66bb6a 0, #66bb6a 10px, transparent 10px, transparent 20px);
            opacity: 0.8;
            position: relative;
            display: flex; justify-content: center; align-items: center;
        }
        /* Simpul DNA di tengah */
        .dna-knot {
            font-size: 3rem; position: absolute; left: 50%; transform: translateX(-50%);
            filter: drop-shadow(0 0 10px #ffeb3b); z-index: 5;
        }

        /* Visual Tim (Karakter & Nama) */
        .team-wrapper {
            position: absolute; top: 60%; width: 50%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 3; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .team-a-wrapper { left: 0; padding-right: 20%; } /* Posisi awal tim kiri */
        .team-b-wrapper { right: 0; padding-left: 20%; } /* Posisi awal tim kanan */

        /* Nama Tim di Atas Kepala */
        .team-name-badge {
            font-size: 1.2rem; font-weight: bold; padding: 5px 15px; border-radius: 10px;
            color: white; margin-bottom: -10px; z-index: 4; white-space: nowrap;
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
        }
        .team-a-badge { background-color: #d32f2f; }
        .team-b-badge { background-color: #1976d2; }

        /* Karakter Praktikan Imut */
        .practitioners { 
            font-size: 4rem; display: flex; gap: -5px; 
            animation: wiggle 2s infinite alternate; /* Animasi bergoyang lucu */
        }
        .practitioners span { margin: 0 -8px; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.3)); }
        @keyframes wiggle { 0% { transform: rotate(-3deg); } 100% { transform: rotate(3deg); } }

        /* Area Soal & Jawaban (Kiri & Kanan) */
        .quiz-area {
            display: flex; width: 100%; justify-content: space-between; padding: 0 20px; gap: 20px; z-index: 5;
        }
        .quiz-column { display: flex; flex-direction: column; width: 48%; gap: 10px; }

        /* Kotak Soal */
        .question-box {
            background-color: white; border: 3px solid #333; border-radius: 15px;
            padding: 15px; font-size: 1.4rem; font-weight: bold; text-align: center;
            box-shadow: 0 4px 0 #999; min-height: 80px; display: flex; align-items: center; justify-content: center;
        }
        .q-a-box { border-color: #d32f2f; box-shadow: 0 4px 0 #b71c1c; }
        .q-b-box { border-color: #1976d2; box-shadow: 0 4px 0 #0d47a1; }

        /* Tombol Jawaban */
        .answer-btn {
            padding: 15px; font-family: 'Patrick Hand', cursive; font-size: 1.5rem; font-weight: bold;
            background-color: #fff; border: 3px solid #333; border-radius: 10px; cursor: pointer;
            text-align: left; transition: all 0.2s; box-shadow: 0 4px 0 #999;
        }
        .answer-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #999; }
        .answer-btn:active { transform: translateY(2px); box-shadow: none; }

        /* Warna Tombol Tim A & B */
        .btn-a { border-color: #d32f2f; box-shadow: 0 4px 0 #b71c1c; }
        .btn-a:hover { background-color: #ffebee; }
        .btn-b { border-color: #1976d2; box-shadow: 0 4px 0 #0d47a1; }
        .btn-b:hover { background-color: #e3f2fd; }

        /* Efek Benar/Salah */
        .answer-btn.correct { background-color: #4caf50 !important; color: white; border-color: #2e7d32 !important; }
        .answer-btn.wrong { background-color: #f44336 !important; color: white; border-color: #c62828 !important; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5);
            display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background-color: #fff; border: 4px solid #1b5e20; border-radius: 10px; padding: 25px;
            width: 90%; max-width: 450px; text-align: center; box-shadow: 8px 8px 0px #81c784;
            position: relative; transform: translateY(-20px); transition: all 0.3s ease; color: #1a2e1a;
        }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: #1b5e20; font-weight: bold; }
        .modal-title { font-size: 2rem; color: #1b5e20; margin-bottom: 15px; border-bottom: 2px dashed #81c784; padding-bottom: 10px; }
    </style>
</head>
<body>
    <div class="bio-background">
        <div class="floating-element el-1">A</div><div class="floating-element el-2">T</div>
        <div class="floating-element el-3">C</div><div class="floating-element el-4">G</div>
    </div>

    <audio id="bg-music" loop><source src="lagu.mp3" type="audio/mpeg"></audio>

    <div class="top-controls">
        <button class="icon-btn" id="open-creator">👥</button>
        <button class="icon-btn" id="mute-btn">🔊</button>
    </div>

    <!-- ================= HALAMAN 1: MENU UTAMA ================= -->
    <div class="page-section active" id="page-main">
        <div class="container-main">
            <h1 class="title">MARI BELAJAR</h1>
            <p style="font-size:1.2rem; margin-bottom: 20px;">FASE F - GENETIKA</p>
            <button class="btn" onclick="alert('Fitur belum siap')">CARA MAIN</button>
            <button class="btn" onclick="alert('Fitur belum siap')">CP / TP</button>
            <button class="btn btn-play" onclick="switchPage('page-select')">PILIH PERMAINAN</button>
        </div>
    </div>

    <!-- ================= HALAMAN 2: PILIH PERMAINAN ================= -->
    <div class="page-section" id="page-select">
        <div class="container-arena">
            <h1 class="title" style="font-size: 2rem;">PILIH PERMAINAN</h1>
            <button class="btn" onclick="switchPage('page-tt-setup')">TARIK TAMBANG 🪢</button>
            <button class="btn" onclick="alert('Belum siap')">FAMILY 100 💯</button>
            <button class="btn" style="border:none; box-shadow:none; text-decoration:underline;" onclick="switchPage('page-main')">⬅ Kembali</button>
        </div>
    </div>

    <!-- ================= HALAMAN 3: SETUP TARIK TAMBANG ================= -->
    <div class="page-section" id="page-tt-setup">
        <div class="setup-box">
            <h1 class="title" style="font-size: 2rem;">PENGATURAN PERTANDINGAN</h1>
            <div class="input-group">
                <label>Nama Tim Kiri (Merah):</label>
                <input type="text" id="input-team-a" value="Tim Helix">
            </div>
            <div class="input-group">
                <label>Nama Tim Kanan (Biru):</label>
                <input type="text" id="input-team-b" value="Tim RNA">
            </div>
            <div class="input-group">
                <label>Pilih Waktu (Detik):</label>
                <div class="timer-options">
                    <button class="timer-btn" onclick="selectTime(30, this)">30</button>
                    <button class="timer-btn selected" onclick="selectTime(60, this)">60</button>
                    <button class="timer-btn" onclick="selectTime(90, this)">90</button>
                    <button class="timer-btn" onclick="selectTime(120, this)">120</button>
                </div>
            </div>
            <button class="btn btn-play" style="margin-top:20px;" onclick="startGameTT()">MULAI!</button>
        </div>
    </div>

    <!-- ================= HALAMAN 4: GAME TARIK TAMBANG ================= -->
    <div class="page-section" id="page-tt-game">
        <div class="game-container-tt">
            
            <!-- Timer di Tengah Atas -->
            <div class="timer-display" id="tt-timer">01:00</div>

            <!-- Area Tarik Tambang (Visual & Karakter) -->
            <div class="tug-of-war-area">
                <div class="center-line"></div>

                <!-- Tali DNA -->
                <div class="rope-container" id="rope-visual">
                    <div class="dna-rope"></div>
                    <div class="dna-knot">🧬</div>
                </div>
                
                <!-- Karakter Tim A (Kiri) -->
                <div class="team-wrapper team-a-wrapper" id="visual-team-a">
                    <div class="team-name-badge team-a-badge" id="display-team-a">TIM A</div>
                    <div class="practitioners">
                        <span>👨‍🔬</span><span>👩‍🔬</span><span>👨‍🔬</span>
                    </div>
                </div>

                <!-- Karakter Tim B (Kanan) -->
                <div class="team-wrapper team-b-wrapper" id="visual-team-b">
                    <div class="team-name-badge team-b-badge" id="display-team-b">TIM B</div>
                    <div class="practitioners">
                        <span>👩‍🔬</span><span>👨‍🔬</span><span>👩‍🔬</span>
                    </div>
                </div>
            </div>

            <!-- Area Soal & Jawaban -->
            <div class="quiz-area">
                <!-- Kolom Kiri (Soal A) -->
                <div class="quiz-column">
                    <div class="question-box q-a-box" id="question-a">Soal untuk Tim A...</div>
                    <button class="answer-btn btn-a" onclick="answerTT('A', 'a', this)">A. Pilihan Pertama</button>
                    <button class="answer-btn btn-a" onclick="answerTT('B', 'a', this)">B. Pilihan Kedua</button>
                </div>

                <!-- Kolom Kanan (Soal B) -->
                <div class="quiz-column">
                    <div class="question-box q-b-box" id="question-b">Soal untuk Tim B...</div>
                    <button class="answer-btn btn-b" onclick="answerTT('C', 'b', this)">C. Pilihan Ketiga</button>
                    <button class="answer-btn btn-b" onclick="answerTT('D', 'b', this)">D. Pilihan Keempat</button>
                </div>
            </div>

            <button class="btn" style="max-width: 200px; align-self: center; margin-top: 10px; padding: 10px; font-size: 1.2rem;" onclick="endGameTT()">⬅ Hentikan</button>
        </div>
    </div>

    <!-- ================= MODAL ================= -->
    <div class="modal-overlay" id="creator-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('creator-modal')">&times;</span>
            <h2 class="modal-title">Tentang Kreator</h2>
            <div style="font-size:1.2rem;"><b>Naztarbaja</b></div>
        </div>
    </div>

    <script>
        // --- Logika Pindah Halaman ---
        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // --- Setup Tarik Tambang ---
        let selectedTime = 60;
        function selectTime(seconds, btnElement) {
            selectedTime = seconds;
            document.querySelectorAll('.timer-btn').forEach(btn => btn.classList.remove('selected'));
            btnElement.classList.add('selected');
        }

        function startGameTT() {
            document.getElementById('display-team-a').innerText = document.getElementById('input-team-a').value || 'Tim Merah';
            document.getElementById('display-team-b').innerText = document.getElementById('input-team-b').value || 'Tim Biru';
            switchPage('page-tt-game');
            startTimer(selectedTime);
            ropePosition = 0;
            updateRopeVisual();
        }

        // --- Timer ---
        let timeLeft = 60;
        let timerInterval;
        function startTimer(duration) {
            timeLeft = duration;
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) { clearInterval(timerInterval); endGameTT(); }
            }, 1000);
        }
        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('tt-timer').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // --- Gameplay ---
        let ropePosition = 0; 

        function answerTT(option, team, btnElement) {
            // Logika sementara: Jawaban benar ditarik ke tim sendiri, salah ditarik ke lawan
            // Anggap saja 'A' dan 'C' benar untuk testing
            const correctAnswers = ['A', 'C'];
            const isCorrect = correctAnswers.includes(option);

            if (isCorrect) {
                // Jika benar, tali ditarik ke arah tim yang menjawab
                if (team === 'a') ropePosition -= 8; // Tarik Kiri
                else ropePosition += 8; // Tarik Kanan
                btnElement.classList.add('correct');
            } else {
                // Jika salah, tali ditarik ke arah lawan
                if (team === 'a') ropePosition += 8; 
                else ropePosition -= 8; 
                btnElement.classList.add('wrong');
            }

            if (ropePosition < -35) ropePosition = -35;
            if (ropePosition > 35) ropePosition = 35;

            updateRopeVisual();

            if (ropePosition <= -35) {
                clearInterval(timerInterval);
                setTimeout(() => alert(`🏆 TIM KIRI MENANG!`), 300);
            } else if (ropePosition >= 35) {
                clearInterval(timerInterval);
                setTimeout(() => alert(`🏆 TIM KANAN MENANG!`), 300);
            }

            setTimeout(() => { btnElement.classList.remove('correct', 'wrong'); }, 1000);
        }

        function updateRopeVisual() {
            document.getElementById('rope-visual').style.transform = `translateX(${ropePosition}%)`;
            document.getElementById('visual-team-a').style.transform = `translateX(${ropePosition}%)`;
            document.getElementById('visual-team-b').style.transform = `translateX(${ropePosition}%)`;
        }

        function endGameTT() {
            clearInterval(timerInterval);
            switchPage('page-select');
        }

        // --- Logika UI Umum (Modal & Musik) ---
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        const modals = document.querySelectorAll('.modal-overlay');
        modals.forEach(modal => {
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
        });

        const muteBtn = document.getElementById('mute-btn');
        const bgMusic = document.getElementById('bg-music');
        document.body.addEventListener('click', function playMusic() {
            if(bgMusic.paused) bgMusic.play().catch(e => console.log("Menunggu interaksi user."));
            document.body.removeEventListener('click', playMusic);
        });
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            bgMusic.muted = !bgMusic.muted;
            muteBtn.innerText = bgMusic.muted ? '🔇' : '🔊';
        });
        document.getElementById('open-creator').addEventListener('click', (e) => { 
            e.stopPropagation(); openModal('creator-modal');
        });
    </script>
</body>
</html>
