<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari Belajar - Tarik Tambang</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #e8f5e9 100%); /* Latar biru muda ke hijau muda */
            font-family: 'Fredoka', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #333; overflow: hidden; position: relative;
        }

        /* Hiasan Latar Belakang (Balon & Gelembung) */
        .bg-decor { position: absolute; z-index: -1; opacity: 0.6; }
        .decor-1 { top: 10%; left: 5%; font-size: 3rem; }
        .decor-2 { top: 15%; right: 5%; font-size: 3rem; }
        .decor-3 { bottom: 20%; left: 10%; font-size: 4rem; opacity: 0.3;}
        .decor-4 { top: 40%; right: 15%; font-size: 2rem; }

        /* Header Controls */
        .top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 10; }
        .icon-btn {
            background-color: white; border: 2px solid #cfd8dc; border-radius: 8px; 
            width: 45px; height: 45px; font-size: 1.2rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: all 0.2s ease;
        }
        .icon-btn:hover { background-color: #f5f5f5; }

        /* Kontainer Halaman */
        .page-section { display: none; width: 100%; justify-content: center; align-items: center; height: 100vh; }
        .page-section.active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Tombol Umum */
        .btn {
            width: 100%; padding: 15px; margin-bottom: 15px; font-family: 'Fredoka', sans-serif; 
            font-size: 1.5rem; font-weight: 600; background: white; border: 2px solid #b0bec5; 
            border-radius: 12px; cursor: pointer; color: #37474f; transition: 0.2s;
            box-shadow: 0 4px 0 #cfd8dc;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #cfd8dc; }
        .btn:active { transform: translateY(2px); box-shadow: none; }
        
        /* ================= DESAIN GAME TARIK TAMBANG (REFERENSI) ================= */
        .game-container-tt {
            width: 100%; max-width: 1200px; height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        /* Timer Pil di Atas */
        .timer-pill {
            background-color: white; padding: 8px 25px; border-radius: 30px; font-size: 1.5rem;
            font-weight: 700; color: #2e7d32; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
        }

        /* Judul Game */
        .game-title-badge {
            background-color: white; padding: 10px 30px; border-radius: 20px;
            font-size: 1.8rem; font-weight: 700; color: #37474f;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 10px;
            margin-bottom: 30px;
        }

        /* Area Tarik Tambang */
        .tug-area {
            position: relative; width: 100%; height: 250px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px;
        }

        /* Tali DNA (CSS Art) */
        .dna-rope {
            position: absolute; width: 250px; height: 60px; z-index: 1;
        }
        .dna-rope::before, .dna-rope::after {
            content: ''; position: absolute; width: 100%; height: 20px;
            border-radius: 20px; border: 6px solid; border-color: transparent;
        }
        .dna-rope::before {
            top: 0; border-top-color: #42a5f5; border-bottom-color: #ef5350;
            transform: skewX(-20deg); animation: dna-spin 2s infinite linear;
        }
        .dna-rope::after {
            top: 15px; border-top-color: #ef5350; border-bottom-color: #42a5f5;
            transform: skewX(20deg); animation: dna-spin 2s infinite linear reverse;
        }
        @keyframes dna-spin {
            0% { transform: skewX(-20deg) scaleY(1); }
            50% { transform: skewX(20deg) scaleY(-1); }
            100% { transform: skewX(-20deg) scaleY(1); }
        }

        /* Simpul Kuning di Tengah */
        .knot-center {
            position: absolute; width: 40px; height: 60px; background-color: #ffca28;
            border: 3px solid #f57f17; border-radius: 8px; z-index: 2; left: 50%; transform: translateX(-50%);
        }
        /* Garis Tengah Arena */
        .center-line {
            position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background-color: #b0bec5; z-index: 0;
        }

        /* Karakter Praktikan */
        .practitioner {
            position: absolute; font-size: 5rem; z-index: 3; transition: transform 0.3s ease;
            /* Filter drop shadow agar seperti vektor */
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.2)); 
        }
        .prac-left { left: 35%; transform: translateX(-50%); }
        .prac-right { right: 35%; transform: translateX(50%); }

        /* Label Nama Tim (Pill) */
        .team-label {
            position: absolute; top: 30px; padding: 8px 20px; border-radius: 20px;
            color: white; font-weight: 600; font-size: 1.2rem; z-index: 4;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .label-left { left: 15%; background-color: #283593; } /* Biru Gelap */
        .label-right { right: 15%; background-color: #880e4f; } /* Merah Gelap */

        /* Area Soal & Jawaban (Dua Kolom) */
        .quiz-area {
            display: flex; justify-content: space-between; width: 95%; max-width: 1000px; gap: 20px; flex: 1;
        }
        
        .quiz-column {
            flex: 1; display: flex; flex-direction: column; border-radius: 15px; overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); background: white;
        }

        /* Header Skor Tim */
        .score-header {
            padding: 20px; font-size: 1.5rem; font-weight: 700; color: white;
        }
        .header-left { background-color: #1976d2; text-align: left; } /* Biru */
        .header-right { background-color: #d81b60; text-align: left; } /* Merah Muda */

        /* Pertanyaan Box */
        .question-box {
            padding: 20px; font-size: 1.3rem; font-weight: 600; color: #37474f;
            border-bottom: 2px solid #eceff1; min-height: 100px;
        }

        /* Daftar Tombol Jawaban */
        .options-list { padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        .option-btn {
            padding: 15px 20px; font-family: 'Fredoka', sans-serif; font-size: 1.1rem; font-weight: 500;
            background-color: #ffffff; border: 2px solid #cfd8dc; border-radius: 10px; cursor: pointer;
            text-align: left; transition: all 0.2s; color: #455a64;
        }
        .option-btn:hover { background-color: #f5f5f5; border-color: #90a4ae; }
        .option-btn.correct { background-color: #c8e6c9 !important; border-color: #4caf50 !important; color: #2e7d32; }
        .option-btn.wrong { background-color: #ffcdd2 !important; border-color: #f44336 !important; color: #c62828; }

        /* (Modal CSS disederhanakan) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5);
            display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background-color: #fff; border-radius: 15px; padding: 25px;
            width: 90%; max-width: 400px; text-align: center;
            position: relative; transform: translateY(-20px); transition: all 0.3s ease;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Hiasan Latar -->
    <div class="bg-decor decor-1">🎈</div>
    <div class="bg-decor decor-2">🎈</div>
    <div class="bg-decor decor-3">🔬</div>
    <div class="bg-decor decor-4">🧪</div>

    <audio id="bg-music" loop><source src="lagu.mp3" type="audio/mpeg"></audio>

    <div class="top-controls">
        <button class="icon-btn" id="open-creator">👥</button>
        <button class="icon-btn" id="mute-btn">🔊</button>
    </div>

    <!-- ================= HALAMAN 1: MENU & SETUP (Sederhana) ================= -->
    <div class="page-section active" id="page-main">
        <div style="text-align:center; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
            <h1 style="color: #2e7d32; margin-bottom: 20px;">MARI BELAJAR</h1>
            <button class="btn btn-play" onclick="switchPage('page-setup')">MULAI TARIK TAMBANG</button>
        </div>
    </div>

    <div class="page-section" id="page-setup">
        <div style="background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
            <h2 style="text-align:center; margin-bottom: 20px; color: #37474f;">Pengaturan</h2>
            <label style="font-weight:600;">Nama Tim Kiri</label>
            <input type="text" id="input-team-a" value="Tim Biru" style="width:100%; padding:10px; border-radius:8px; border:2px solid #cfd8dc; margin-bottom:15px; font-family:'Fredoka';">
            
            <label style="font-weight:600;">Nama Tim Kanan</label>
            <input type="text" id="input-team-b" value="Tim Merah" style="width:100%; padding:10px; border-radius:8px; border:2px solid #cfd8dc; margin-bottom:20px; font-family:'Fredoka';">

            <button class="btn" style="background:#1976d2; color:white; border:none; box-shadow:0 4px 0 #0d47a1;" onclick="startGameTT()">MULAI!</button>
        </div>
    </div>

    <!-- ================= HALAMAN 2: GAME TARIK TAMBANG (Desain Baru) ================= -->
    <div class="page-section" id="page-tt-game">
        <div class="game-container-tt">
            
            <!-- Timer -->
            <div class="timer-pill">
                ⏱️ <span id="tt-timer">40 s</span>
            </div>

            <!-- Judul -->
            <div class="game-title-badge">
                🏆 Tarik Tambang Kuis Biologi
            </div>

            <!-- Area Tarik Tambang -->
            <div class="tug-area">
                <!-- Label Tim -->
                <div class="team-label label-left" id="display-team-a">Tim Kiri</div>
                <div class="team-label label-right" id="display-team-b">Tim Kanan</div>

                <div class="center-line"></div>
                
                <!-- Karakter Kiri & Kanan -->
                <div class="practitioner prac-left" id="visual-team-a">👨‍🔬</div>
                <div class="practitioner prac-right" id="visual-team-b">👩‍🔬</div>

                <!-- Tali DNA -->
                <div class="dna-rope" id="rope-visual">
                    <div class="knot-center"></div>
                </div>
            </div>

            <!-- Teks Panduan -->
            <div style="background: white; padding: 10px 30px; border-radius: 20px; font-weight: 600; color: #546e7a; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                Jawab soal untuk menarik tali! 📝
            </div>

            <!-- Area Soal & Jawaban (Dua Kolom) -->
            <div class="quiz-area">
                
                <!-- Tim Kiri -->
                <div class="quiz-column">
                    <div class="score-header header-left" id="score-team-a">14</div>
                    <div class="question-box" id="question-a">Soal untuk Tim Kiri akan muncul di sini.</div>
                    <div class="options-list" id="options-a">
                        <button class="option-btn" onclick="answerTT('A', 'a', this)">Pilihan Jawaban A</button>
                        <button class="option-btn" onclick="answerTT('B', 'a', this)">Pilihan Jawaban B</button>
                    </div>
                </div>

                <!-- Tim Kanan -->
                <div class="quiz-column">
                    <div class="score-header header-right" id="score-team-b">13</div>
                    <div class="question-box" id="question-b">Soal untuk Tim Kanan akan muncul di sini.</div>
                    <div class="options-list" id="options-b">
                        <button class="option-btn" onclick="answerTT('C', 'b', this)">Pilihan Jawaban C</button>
                        <button class="option-btn" onclick="answerTT('D', 'b', this)">Pilihan Jawaban D</button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- ================= MODAL ================= -->
    <div class="modal-overlay" id="creator-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('creator-modal')">&times;</span>
            <h2 style="margin-bottom:15px; color:#37474f;">Tentang Kreator</h2>
            <div style="font-size:1.2rem; font-weight:600;">Naztarbaja</div>
        </div>
    </div>

    <script>
        // --- Logika Pindah Halaman ---
        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // --- Setup ---
        function startGameTT() {
            document.getElementById('display-team-a').innerText = document.getElementById('input-team-a').value || 'Tim Kiri';
            document.getElementById('display-team-b').innerText = document.getElementById('input-team-b').value || 'Tim Kanan';
            switchPage('page-tt-game');
            startTimer(40); // Sesuai referensi 40 detik
            ropePosition = 0;
            updateRopeVisual();
        }

        // --- Timer ---
        let timeLeft = 40;
        let timerInterval;
        function startTimer(duration) {
            timeLeft = duration;
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) { clearInterval(timerInterval); alert("Waktu Habis!"); }
            }, 1000);
        }
        function updateTimerDisplay() {
            document.getElementById('tt-timer').innerText = `${timeLeft} s`;
        }

        // --- Gameplay (Sederhana) ---
        let ropePosition = 0; 
        let scoreA = 14; // Mengikuti desain awal
        let scoreB = 13;

        function answerTT(option, team, btnElement) {
            // Anggap 'A' dan 'C' adalah jawaban benar sementara
            const isCorrect = (option === 'A' || option === 'C');

            if (isCorrect) {
                if (team === 'a') { ropePosition -= 5; scoreA += 10; document.getElementById('score-team-a').innerText = scoreA; }
                else { ropePosition += 5; scoreB += 10; document.getElementById('score-team-b').innerText = scoreB; }
                btnElement.classList.add('correct');
            } else {
                if (team === 'a') { ropePosition += 5; scoreB += 10; document.getElementById('score-team-b').innerText = scoreB; }
                else { ropePosition -= 5; scoreA += 10; document.getElementById('score-team-a').innerText = scoreA; }
                btnElement.classList.add('wrong');
            }

            if (ropePosition < -30) ropePosition = -30;
            if (ropePosition > 30) ropePosition = 30;

            updateRopeVisual();

            if (ropePosition <= -30) { alert('TIM KIRI MENANG!'); }
            if (ropePosition >= 30) { alert('TIM KANAN MENANG!'); }

            setTimeout(() => { btnElement.classList.remove('correct', 'wrong'); }, 1000);
        }

        function updateRopeVisual() {
            // Geser karakter dan tali
            document.getElementById('visual-team-a').style.transform = `translateX(${ropePosition}%)`;
            document.getElementById('visual-team-b').style.transform = `translateX(${ropePosition}%)`;
            // Tali sedikit bergeser agar simpulnya tetap di tengah
            document.getElementById('rope-visual').style.transform = `translateX(${ropePosition / 2}%)`;
        }

        // --- UI Umum ---
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        const modals = document.querySelectorAll('.modal-overlay');
        modals.forEach(modal => {
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
        });

        const muteBtn = document.getElementById('mute-btn');
        const bgMusic = document.getElementById('bg-music');
        document.body.addEventListener('click', function playMusic() {
            if(bgMusic.paused) bgMusic.play().catch(e => console.log("Menunggu interaksi user."));
            document.body.removeEventListener('click', playMusic);
        });
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            bgMusic.muted = !bgMusic.muted;
            muteBtn.innerText = bgMusic.muted ? '🔇' : '🔊';
        });
        document.getElementById('open-creator').addEventListener('click', (e) => { 
            e.stopPropagation(); openModal('creator-modal');
        });
    </script>
</body>
</html>
