<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari Belajar - Fase F (Genetika)</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <style>
        /* Pengaturan Dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #eef7ee; 
            font-family: 'Patrick Hand', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1a2e1a;
            overflow: hidden;
            position: relative;
        }

        /* Animasi Latar Belakang (Z-index dibuat negatif agar selalu di bawah) */
        .bio-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; /* KUNCI: Agar tidak menimpa teks */
            overflow: hidden;
            opacity: 0.1;
            font-family: 'Permanent Marker', cursive;
            font-size: 3rem;
            color: #2e7d32;
            pointer-events: none; /* Agar tidak bisa diklik */
        }

        .floating-element {
            position: absolute;
            animation: float 10s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(15deg); }
        }

        .el-1 { top: 10%; left: 10%; }
        .el-2 { top: 20%; right: 15%; animation-delay: 2s; }
        .el-3 { bottom: 15%; left: 15%; animation-delay: 1s; }
        .el-4 { bottom: 25%; right: 10%; animation-delay: 3s; }
        .el-5 { top: 50%; left: 5%; animation-delay: 4s; }
        .el-6 { top: 60%; right: 8%; animation-delay: 1.5s; }

        /* --- HEADER (Tombol Kanan Atas) --- */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .icon-btn {
            background-color: white;
            border: 3px solid #1b5e20;
            border-radius: 50%; /* Membuat tombol bulat */
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 2px 0px #81c784;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background-color: #e8f5e9;
            transform: translateY(-2px);
        }

        /* --- KONTEN UTAMA --- */
        .container {
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 1; /* Pastikan konten di atas background */
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 5px;
            width: 100%;
        }

        .dna-icon {
            font-size: 3.5rem;
            animation: spin-pulse 4s infinite linear;
        }

        @keyframes spin-pulse {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(10deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .title {
            font-family: 'Permanent Marker', cursive;
            font-size: 3.5rem;
            text-align: center;
            transform: rotate(-2deg);
            letter-spacing: 2px;
            color: #1b5e20;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 25px;
            letter-spacing: 3px;
            background-color: #81c784;
            padding: 2px 15px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
        }

        .menu-box {
            border: 4px solid #1b5e20;
            width: 100%;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 6px 6px 0px #81c784;
            position: relative;
        }

        .menu-box::before {
            content: "🧬";
            position: absolute;
            top: -15px;
            right: -15px;
            font-size: 2rem;
            background: #fff;
            border-radius: 50%;
            padding: 5px;
            z-index: 2;
        }

        /* Tombol Menu */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-family: 'Patrick Hand', cursive;
            font-size: 2rem;
            font-weight: bold;
            background-color: #fff;
            border: 3px solid #1b5e20;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: #1b5e20;
            transition: all 0.1s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background-color: #e8f5e9;
            transform: translateY(-2px);
            box-shadow: 3px 3px 0px #1b5e20;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .btn::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 5px; height: 100%;
            background-color: #66bb6a;
        }

        /* Tombol Pilih Permainan (Warna Ungu Bioteknologi) */
        .btn-play {
            border-color: #6a1b9a; /* Ungu gelap */
            color: #6a1b9a;
            font-size: 2.5rem;
            padding: 20px 15px;
            background-color: #f3e5f5; /* Ungu sangat muda */
        }

        .btn-play::after {
            background-color: #ab47bc;
        }

        .btn-play:hover {
            background-color: #e1bee7;
            box-shadow: 3px 3px 0px #6a1b9a;
        }

        /* --- POP-UP KREATOR (Tersembunyi secara default) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: #fff;
            border: 4px solid #1b5e20;
            border-radius: 10px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 8px 8px 0px #81c784;
            position: relative;
            transform: translateY(-20px);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #1b5e20;
            font-weight: bold;
        }

        .modal-title {
            font-size: 2rem;
            color: #1b5e20;
            margin-bottom: 15px;
            border-bottom: 2px dashed #81c784;
            padding-bottom: 10px;
        }

        .creator-info {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .social-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.3rem;
            color: #1b5e20;
            text-decoration: none;
            background-color: #e8f5e9;
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #66bb6a;
            transition: all 0.2s;
        }

        .social-item:hover {
            background-color: #c8e6c9;
        }

        .social-icon {
            font-size: 1.5rem;
        }

    </style>
</head>
<body>

    <!-- Background Elemen Biologi (Tidak akan menimpa teks) -->
    <div class="bio-background">
        <div class="floating-element el-1">A</div>
        <div class="floating-element el-2">T</div>
        <div class="floating-element el-3">C</div>
        <div class="floating-element el-4">G</div>
        <div class="floating-element el-5">🧬</div>
        <div class="floating-element el-6">🧬</div>
    </div>

    <!-- Tombol Kontrol Kanan Atas -->
    <div class="top-controls">
        <!-- Tombol Komunitas / Kreator -->
        <button class="icon-btn" id="open-creator" title="Info Kreator">👥</button>
        <!-- Tombol Mute / Unmute -->
        <button class="icon-btn" id="mute-btn" title="Mute/Unmute Musik">🔊</button>
    </div>

    <div class="container">
        <!-- Judul -->
        <div class="title-wrapper">
            <div class="dna-icon">🧬</div>
            <h1 class="title">MARI BELAJAR</h1>
            <div class="dna-icon">🧬</div>
        </div>
        
        <p class="subtitle">FASE F - GENETIKA</p>

        <!-- Menu Utama -->
        <div class="menu-box">
            <a href="cara-main.html" class="btn">CARA MAIN</a>
            <a href="cp-tp.html" class="btn">CP / TP</a>
            <a href="pilih-permainan.html" class="btn btn-play">PILIH PERMAINAN</a>
        </div>
    </div>

    <!-- POP-UP KREATOR (Tersembunyi) -->
    <div class="modal-overlay" id="creator-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-creator">&times;</span>
            <h2 class="modal-title">Tentang Kreator</h2>
            
            <div class="creator-info">
                <!-- Tempat identitas yang akan kamu isi nanti -->
                <p><b>Naztarbaja</b></p>
                <p style="font-size: 1rem; color: #666; margin-top: 5px;">
                    (Silakan isi deskripsi kelompok, sekolah, atau kelas di sini nanti)
                </p>
            </div>

            <div class="social-links">
                <!-- Ikon Instagram dan TikTok -->
                <a href="#" class="social-item" target="_blank">
                    <span class="social-icon">📸</span> @.naztarbaja
                </a>
                <a href="#" class="social-item" target="_blank">
                    <span class="social-icon">🎵</span> @.naztarbaja
                </a>
            </div>
        </div>
    </div>

    <!-- SCRIPT UNTUK INTERAKSI (Mute & Pop-up) -->
    <script>
        // --- 1. Logika Tombol Mute ---
        const muteBtn = document.getElementById('mute-btn');
        let isMuted = false;

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (isMuted) {
                muteBtn.innerText = '🔇'; // Ganti ikon ke mute
                // Logika untuk mematikan audio (bisa ditambahkan nanti)
            } else {
                muteBtn.innerText = '🔊'; // Ganti ikon ke unmute
                // Logika untuk menyalakan audio (bisa ditambahkan nanti)
            }
        });

        // --- 2. Logika Pop-up Kreator ---
        const creatorModal = document.getElementById('creator-modal');
        const openCreatorBtn = document.getElementById('open-creator');
        const closeCreatorBtn = document.getElementById('close-creator');

        // Buka pop-up
        openCreatorBtn.addEventListener('click', () => {
            creatorModal.classList.add('active');
        });

        // Tutup pop-up via tombol X
        closeCreatorBtn.addEventListener('click', () => {
            creatorModal.classList.remove('active');
        });

        // Tutup pop-up jika klik di luar kotak
        creatorModal.addEventListener('click', (e) => {
            if (e.target === creatorModal) {
                creatorModal.classList.remove('active');
            }
        });
    </script>

</body>
</html>
