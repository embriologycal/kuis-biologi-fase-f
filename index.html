<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari Belajar - Fase F (Genetika)</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #eef7ee; 
            font-family: 'Patrick Hand', cursive;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #1a2e1a; overflow: hidden; position: relative;
        }
        
        /* Latar Belakang Animasi */
        .bio-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; opacity: 0.1;
            font-family: 'Permanent Marker', cursive; font-size: 3rem; color: #2e7d32; pointer-events: none;
        }
        .floating-element { position: absolute; animation: float 10s infinite ease-in-out alternate; }
        @keyframes float { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-30px) rotate(15deg); } }
        .el-1 { top: 10%; left: 10%; } .el-2 { top: 20%; right: 15%; animation-delay: 2s; }
        .el-3 { bottom: 15%; left: 15%; animation-delay: 1s; } .el-4 { bottom: 25%; right: 10%; animation-delay: 3s; }
        .el-5 { top: 50%; left: 5%; animation-delay: 4s; } .el-6 { top: 60%; right: 8%; animation-delay: 1.5s; }

        /* Header Kontrol */
        .top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 10; }
        .icon-btn {
            background-color: white; border: 3px solid #1b5e20; border-radius: 50%; 
            width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 2px 2px 0px #81c784; transition: all 0.2s ease;
        }
        .icon-btn:hover { background-color: #e8f5e9; transform: translateY(-2px); }

        /* Kontainer Halaman (Single Page) */
        .page-section { 
            display: none; /* Sembunyikan secara default */
            width: 100%; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }
        .page-section.active { 
            display: flex; /* Hanya tampilkan yang aktif */
            animation: fadeIn 0.5s ease; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* --- DESAIN MENU UTAMA --- */
        .container-main { width: 90%; max-width: 600px; display: flex; flex-direction: column; align-items: center; z-index: 1; }
        .title-wrapper { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 5px; width: 100%; }
        .dna-icon { font-size: 3.5rem; animation: spin-pulse 4s infinite linear; }
        @keyframes spin-pulse { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(10deg) scale(1.1); } 100% { transform: rotate(0deg) scale(1); } }
        .title { font-family: 'Permanent Marker', cursive; font-size: 3.5rem; text-align: center; transform: rotate(-2deg); letter-spacing: 2px; color: #1b5e20; }
        .subtitle { font-size: 1.5rem; margin-bottom: 25px; letter-spacing: 3px; background-color: #81c784; padding: 2px 15px; border-radius: 20px; color: #fff; font-weight: bold; }

        .menu-box {
            border: 4px solid #1b5e20; width: 100%; padding: 30px 20px;
            display: flex; flex-direction: column; gap: 20px; border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.95); box-shadow: 6px 6px 0px #81c784; position: relative;
        }
        .btn {
            display: block; width: 100%; padding: 15px; font-family: 'Patrick Hand', cursive; font-size: 2rem; font-weight: bold;
            background-color: #fff; border: 3px solid #1b5e20; border-radius: 5px; cursor: pointer;
            text-align: center; text-decoration: none; color: #1b5e20; transition: all 0.1s ease; position: relative; overflow: hidden;
        }
        .btn:hover { background-color: #e8f5e9; transform: translateY(-2px); box-shadow: 3px 3px 0px #1b5e20; }
        .btn:active { transform: translateY(2px); box-shadow: none; }
        .btn::after { content: ""; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background-color: #66bb6a; }
        .btn-play { border-color: #6a1b9a; color: #6a1b9a; font-size: 2.5rem; padding: 20px 15px; background-color: #f3e5f5; }
        .btn-play::after { background-color: #ab47bc; }
        .btn-play:hover { background-color: #e1bee7; box-shadow: 3px 3px 0px #6a1b9a; }

        /* --- DESAIN PILIH PERMAINAN --- */
        .container-arena { width: 90%; max-width: 700px; display: flex; flex-direction: column; align-items: center; z-index: 1; }
        .arena-box {
            border: 5px solid #1b5e20; border-radius: 30px; background-color: rgba(255, 255, 255, 0.95);
            padding: 50px 30px 30px 30px; width: 100%; box-shadow: 10px 10px 0px #f57c00;
            position: relative; display: flex; flex-direction: column; gap: 20px; 
        }
        .arena-box::before {
            content: "🚩 PILIH PERMAINAN 🚩"; position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            background-color: #f57c00; color: white; padding: 5px 30px; border-radius: 20px;
            font-size: 1.3rem; font-weight: bold; letter-spacing: 2px; white-space: nowrap;
        }
        .btn-lomba {
            display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 20px 30px;
            font-family: 'Patrick Hand', cursive; font-size: 2.2rem; font-weight: bold; background-color: #fff;
            border: 3px dashed #1b5e20; border-radius: 15px; cursor: pointer; text-decoration: none;
            color: #1b5e20; transition: all 0.2s ease; position: relative; overflow: hidden;
        }
        .btn-lomba::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background-color: #f57c00; }
        .btn-lomba:hover { background-color: #fff8e1; transform: scale(1.02) translateY(-3px); box-shadow: 0px 6px 0px #f57c00; border-style: solid; }
        .btn-lomba:active { transform: translateY(2px); box-shadow: none; }
        .btn-icon { font-size: 2.5rem; }
        
        .btn-back {
            display: inline-block; margin-top: 15px; padding: 10px 20px; font-size: 1.5rem;
            color: #1b5e20; text-decoration: none; font-weight: bold; border-bottom: 2px solid transparent; transition: all 0.2s; cursor: pointer; background: none; border: none;
        }
        .btn-back:hover { border-bottom: 2px solid #1b5e20; color: #f57c00; }

        /* --- POP-UP KREATOR --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5);
            display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background-color: #fff; border: 4px solid #1b5e20; border-radius: 10px; padding: 25px;
            width: 90%; max-width: 400px; text-align: center; box-shadow: 8px 8px 0px #81c784;
            position: relative; transform: translateY(-20px); transition: all 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: #1b5e20; font-weight: bold; }
        .modal-title { font-size: 2rem; color: #1b5e20; margin-bottom: 15px; border-bottom: 2px dashed #81c784; padding-bottom: 10px; }
        .creator-info { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.5; }
        .social-links { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .social-item {
            display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.3rem; color: #1b5e20;
            text-decoration: none; background-color: #e8f5e9; padding: 10px; border-radius: 5px; border: 2px solid #66bb6a; transition: all 0.2s;
        }
        .social-item:hover { background-color: #c8e6c9; }
        .social-icon { font-size: 1.5rem; }
    </style>
</head>
<body>
    <div class="bio-background">
        <div class="floating-element el-1">A</div><div class="floating-element el-2">T</div>
        <div class="floating-element el-3">C</div><div class="floating-element el-4">G</div>
        <div class="floating-element el-5">🧬</div><div class="floating-element el-6">🧬</div>
    </div>

    <!-- Audio Utama -->
    <audio id="bg-music" loop><source src="lagu.mp3" type="audio/mpeg"></audio>

    <!-- Kontrol Kanan Atas -->
    <div class="top-controls">
        <button class="icon-btn" id="open-creator">👥</button>
        <button class="icon-btn" id="mute-btn">🔊</button>
    </div>

    <!-- ================= HALAMAN 1: MENU UTAMA ================= -->
    <div class="page-section active" id="page-main">
        <div class="container-main">
            <div class="title-wrapper">
                <div class="dna-icon">🧬</div><h1 class="title">MARI BELAJAR</h1><div class="dna-icon">🧬</div>
            </div>
            <p class="subtitle">FASE F - GENETIKA</p>
            <div class="menu-box">
                <a href="#" class="btn">CARA MAIN</a>
                <a href="#" class="btn">CP / TP</a>
                <button class="btn btn-play" onclick="switchPage('page-select')">PILIH PERMAINAN</button>
            </div>
        </div>
    </div>

    <!-- ================= HALAMAN 2: PILIH PERMAINAN ================= -->
    <div class="page-section" id="page-select">
        <div class="container-arena">
            <div class="arena-box">
                <a href="tarik-tambang.html" class="btn-lomba"><span>TARIK TAMBANG</span><span class="btn-icon">🪢</span></a>
                <a href="family-100.html" class="btn-lomba"><span>FAMILY 100</span><span class="btn-icon">💯</span></a>
            </div>
            <button class="btn-back" onclick="switchPage('page-main')">⬅ Kembali ke Menu</button>
        </div>
    </div>

    <!-- Pop-up Kreator -->
    <div class="modal-overlay" id="creator-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-creator">&times;</span>
            <h2 class="modal-title">Tentang Kreator</h2>
            <div class="creator-info">
                <p><b>Naztarbaja</b></p>
                <p style="font-size: 1rem; color: #666; margin-top: 5px;">(Deskripsi kelompok di sini)</p>
            </div>
            <div class="social-links">
                <a href="#" class="social-item"><span class="social-icon">📸</span> @.naztarbaja</a>
                <a href="#" class="social-item"><span class="social-icon">🎵</span> @.naztarbaja</a>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // --- 1. Logika Pindah Halaman (Single Page) ---
        function switchPage(pageId) {
            // Sembunyikan semua halaman
            const pages = document.querySelectorAll('.page-section');
            pages.forEach(page => page.classList.remove('active'));
            
            // Tampilkan halaman yang dituju
            document.getElementById(pageId).classList.add('active');
        }

        // --- 2. Logika Musik & Mute ---
        const muteBtn = document.getElementById('mute-btn');
        const bgMusic = document.getElementById('bg-music');
        
        // Putar lagu saat layar pertama kali diklik
        document.body.addEventListener('click', function playMusic() {
            if(bgMusic.paused) bgMusic.play().catch(e => console.log("Menunggu interaksi user."));
            document.body.removeEventListener('click', playMusic);
        });

        // Tombol Mute
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            bgMusic.muted = !bgMusic.muted;
            muteBtn.innerText = bgMusic.muted ? '🔇' : '🔊';
        });

        // --- 3. Logika Kreator ---
        const creatorModal = document.getElementById('creator-modal');
        document.getElementById('open-creator').addEventListener('click', (e) => { e.stopPropagation(); creatorModal.classList.add('active'); });
        document.getElementById('close-creator').addEventListener('click', () => creatorModal.classList.remove('active'));
        creatorModal.addEventListener('click', (e) => { if (e.target === creatorModal) creatorModal.classList.remove('active'); });
    </script>
</body>
</html>
