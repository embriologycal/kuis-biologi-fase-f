<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family 100 - Diskusi Tim</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #eef7ee; 
            font-family: 'Patrick Hand', cursive;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #1a2e1a; overflow: hidden; position: relative;
        }

        /* Latar Belakang Biologi */
        .bio-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; opacity: 0.1;
            font-family: 'Permanent Marker', cursive; font-size: 3rem; color: #2e7d32; pointer-events: none;
        }
        .floating-element { position: absolute; animation: float 10s infinite ease-in-out alternate; }
        @keyframes float { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-30px) rotate(15deg); } }
        .el-1 { top: 10%; left: 10%; } .el-2 { top: 20%; right: 15%; animation-delay: 2s; }
        .el-3 { bottom: 15%; left: 15%; animation-delay: 1s; } .el-4 { bottom: 25%; right: 10%; animation-delay: 3s; }

        /* Header Kontrol */
        .top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 10; }
        .icon-btn {
            background-color: white; border: 3px solid #1b5e20; border-radius: 50%; 
            width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 2px 2px 0px #81c784; transition: all 0.2s ease;
        }
        .icon-btn:hover { background-color: #e8f5e9; transform: translateY(-2px); }

        /* --- SETUP & DADU SCREEN --- */
        .setup-container {
            width: 90%; max-width: 600px; background-color: #0d1b2a; border: 5px solid #1b5e20; border-radius: 20px;
            padding: 40px 30px; color: white; text-align: center; z-index: 10; box-shadow: 0 0 20px rgba(27, 94, 32, 0.7);
            display: flex; flex-direction: column; align-items: center;
        }
        .setup-title { font-family: 'Permanent Marker', cursive; font-size: 2.5rem; color: #4caf50; margin-bottom: 20px; }
        
        .dice-area { display: flex; justify-content: center; margin: 30px 0; }
        .dice-box { 
            width: 120px; height: 120px; background-color: white; border-radius: 20px;
            display: flex; justify-content: center; align-items: center; font-size: 6rem; color: #0d1b2a; font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); margin-bottom: 10px;
        }
        .dice-box.rolling { animation: spin 0.5s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-dadu {
            background-color: #fbc02d; color: #0d1b2a; font-family: 'Patrick Hand', cursive;
            font-size: 1.8rem; font-weight: bold; padding: 15px 40px; border-radius: 12px;
            cursor: pointer; border: none; transition: 0.2s; margin-top: 20px;
        }
        .btn-dadu:hover { background-color: #fdd835; transform: translateY(-2px); }
        .btn-dadu:disabled { background-color: #78909c; cursor: not-allowed; transform: none; }

        /* ================= DESAIN GAME (DIPADATKAN) ================= */
        .game-container {
            display: none; width: 98%; max-width: 1200px; height: 96vh; background-color: #0d1b2a;
            border: 5px solid #1b5e20; border-radius: 20px; padding: 15px 25px;
            box-shadow: 0 0 20px rgba(27, 94, 32, 0.7); flex-direction: column;
            z-index: 1; position: relative; color: white;
        }

        .game-header {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            margin-bottom: 10px; border-bottom: 2px solid #1b5e20; padding-bottom: 5px;
        }
        .team-score {
            display: flex; flex-direction: column; align-items: center;
            background-color: #1b263b; padding: 5px 20px; border-radius: 10px;
            border: 2px solid #81c784; min-width: 120px; transition: 0.3s;
        }
        .team-score.active-turn { border-color: #fbc02d; box-shadow: 0 0 10px #fbc02d; transform: scale(1.02); }
        .team-name { font-size: 1rem; font-weight: bold; color: #e0e1dd; }
        .team-points { font-size: 2rem; font-weight: bold; color: #4caf50; font-family: 'Permanent Marker', cursive; }

        .center-board { text-align: center; }
        .timer-display {
            font-family: 'Permanent Marker', cursive; font-size: 2.5rem; color: #d32f2f;
            background-color: white; padding: 2px 20px; border-radius: 10px;
            border: 3px solid #d32f2f; display: inline-block;
        }
        .turn-text { font-size: 1.2rem; font-weight: bold; color: #fbc02d; font-family: 'Permanent Marker', cursive; margin-top: 2px;}

        /* Area Soal & Input (Lebih Ramping) */
        .question-area { text-align: center; margin-bottom: 8px; }
        .question-text {
            background-color: #1b263b; display: inline-block; padding: 8px 25px;
            border-radius: 10px; font-size: 1.3rem; font-weight: bold; border: 2px solid #81c784;
            min-width: 300px;
        }

        .input-area { text-align: center; margin-bottom: 10px; display: flex; justify-content: center; gap: 10px; }
        .input-jawaban {
            width: 40%; padding: 8px 15px; font-family: 'Patrick Hand', cursive; font-size: 1.2rem;
            border-radius: 8px; border: 3px solid #81c784; outline: none; text-align: center;
        }
        .btn-submit {
            background-color: #81c784; color: #0d1b2a; font-weight: bold; font-size: 1.2rem;
            border: none; border-radius: 8px; padding: 8px 20px; cursor: pointer; transition: 0.2s;
        }
        .btn-submit:hover { background-color: #a5d6a7; }

        /* Daftar Jawaban (Flexbox agar muat banyak) */
        .answers-list { display: flex; flex-direction: column; gap: 8px; width: 100%; flex: 1; justify-content: center; }
        .answer-item {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #1b263b; border: 2px solid #415a77; border-radius: 8px;
            padding: 8px 15px; font-size: 1.2rem; transition: all 0.4s ease;
        }
        .answer-rank { 
            background-color: #81c784; color: #0d1b2a; font-weight: bold; 
            width: 30px; height: 30px; display: flex; justify-content: center; align-items: center;
            border-radius: 50%; font-size: 1.2rem;
        }
        .answer-content { flex: 1; padding-left: 15px; text-align: left; font-weight: bold; font-size: 1.3rem; }
        .hidden-box { color: #fbc02d; font-size: 1.5rem; letter-spacing: 5px; }
        .answer-points { font-weight: bold; color: #fbc02d; font-size: 1.5rem; opacity: 0; transition: opacity 0.4s; }
        
        /* Efek Terbuka */
        .answer-item.revealed { background-color: #2e7d32; border-color: #4caf50; }
        .answer-item.revealed .hidden-box { display: none; } /* Sembunyikan ? */
        .answer-item.revealed .answer-content { color: white; }
        .answer-item.revealed .answer-points { opacity: 1; }

        /* Tanda X */
        .strikes-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; gap: 20px; font-size: 8rem; font-family: 'Permanent Marker', cursive;
            color: #d32f2f; text-shadow: 5px 5px 0px #000; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 20;
        }
        .strikes-container.active { opacity: 1; animation: pop 0.3s ease; }
        @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.5); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* Kontrol Bawah */
        .host-controls { display: flex; gap: 15px; justify-content: center; margin-top: 10px; }
        .btn-game {
            font-family: 'Patrick Hand', cursive; font-size: 1.1rem; font-weight: bold;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; border: none;
            transition: all 0.2s; box-shadow: 0 3px 0 rgba(0,0,0,0.5);
        }
        .btn-game:active { transform: translateY(3px); box-shadow: none; }
        .btn-strike { background-color: #c62828; color: white; }
        .btn-strike:hover { background-color: #e53935; }
        .btn-next { background-color: #fbc02d; color: #1a2e1a; }
        .btn-next:hover { background-color: #fdd835; }
        .btn-show-q { background-color: #4caf50; color: white; font-size: 1.3rem; padding: 10px 25px;}
        .btn-show-q:hover { background-color: #388e3c; }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85);
            display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background-color: #1b263b; border: 4px solid #fbc02d; border-radius: 15px; padding: 40px;
            width: 90%; max-width: 600px; text-align: center; position: relative; transform: scale(0.8); transition: 0.3s;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-title { font-size: 3rem; color: #fbc02d; margin-bottom: 15px; font-family: 'Permanent Marker', cursive; }
        .modal-text { font-size: 1.5rem; margin-bottom: 30px; }
        
        .btn-action { background-color: #4caf50; color: white; font-size: 1.8rem; padding: 15px 40px; }
        .btn-action:hover { background-color: #388e3c; }
    </style>
</head>
<body>
    <div class="bio-background">
        <div class="floating-element el-1">A</div><div class="floating-element el-2">T</div>
        <div class="floating-element el-3">C</div><div class="floating-element el-4">G</div>
    </div>

    <div class="top-controls">
        <button class="icon-btn" id="fullscreen-btn" title="Layar Penuh">⛶</button>
        <button class="icon-btn" onclick="window.location.href='index.html'" title="Keluar">⬅</button>
    </div>

    <!-- ================= LAYAR SETUP & DADU ================= -->
    <div class="setup-container" id="setup-screen">
        <h1 class="setup-title">TENTUKAN GILIRAN!</h1>
        
        <div style="margin-bottom:20px; display:flex; gap:10px;">
            <input type="text" id="input-name-a" placeholder="Nama Tim 1" value="Tim Merah" style="padding:10px; font-family:Patrick Hand; font-size:1.2rem; border-radius:8px; text-align:center; width:150px;">
            <input type="text" id="input-name-b" placeholder="Nama Tim 2" value="Tim Biru" style="padding:10px; font-family:Patrick Hand; font-size:1.2rem; border-radius:8px; text-align:center; width:150px;">
        </div>

        <div class="dice-area">
            <div class="dice-box" id="dice-main">🎲</div>
        </div>

        <button class="btn-dadu" id="roll-btn" onclick="rollDice()">LEMPAR DADU!</button>
    </div>

    <!-- ================= MODAL PEMENANG DADU ================= -->
    <div class="modal-overlay" id="modal-jeda">
        <div class="modal-content" style="border-color: #4caf50;">
            <h2 class="modal-title" id="jeda-title" style="color: #4caf50;">TIM MERAH MAIN DULU!</h2>
            <p class="modal-text">Bersiaplah untuk berdiskusi. Juru bicara akan mengetikkan jawaban.</p>
            <button class="btn-game btn-action" onclick="startGame()">MULAI!</button>
        </div>
    </div>

    <!-- ================= GAME CONTAINER ================= -->
    <div class="game-container" id="game-screen">
        <div class="game-header">
            <div class="team-score" id="team-box-a">
                <span class="team-name" id="display-name-a">TIM A</span>
                <span class="team-points" id="score-a">0</span>
            </div>
            <div class="center-board">
                <div class="timer-display" id="timer-display">30</div>
                <div class="turn-text" id="turn-display">GILIRAN: TIM A</div>
            </div>
            <div class="team-score" id="team-box-b">
                <span class="team-name" id="display-name-b">TIM B</span>
                <span class="team-points" id="score-b">0</span>
            </div>
        </div>

        <div class="question-area">
            <div class="question-text" id="question-text">Soal disembunyikan. Klik "Tampilkan Soal" untuk memulai.</div>
        </div>

        <div class="input-area">
            <input type="text" id="input-jawaban" class="input-jawaban" placeholder="Juru Bicara: Ketik jawaban..." onkeypress="handleKeyPress(event)" disabled>
            <button class="btn-submit" onclick="cekInputJawaban()" disabled id="btn-submit">Kirim</button>
        </div>

        <!-- Daftar Jawaban -->
        <div class="answers-list" id="answers-container"></div>

        <div class="strikes-container" id="strikes-display"><span>X</span><span>X</span><span>X</span></div>

        <div class="host-controls">
            <button class="btn-game btn-show-q" id="btn-show-q" onclick="tampilkanSoal()">Tampilkan Soal & Mulai Waktu</button>
            <button class="btn-game btn-strike" onclick="tambahXManual()">Tambah X (Salah)</button>
            <button class="btn-game btn-next" onclick="loadNextQuestion()">Soal Baru</button>
        </div>
    </div>

    <!-- Modal Waktu Habis -->
    <div class="modal-overlay" id="modal-waktu">
        <div class="modal-content">
            <h2 class="modal-title">WAKTU HABIS!</h2>
            <p class="modal-text" id="modal-text-waktu">Giliran tim berikutnya untuk mencoba sisa jawaban.</p>
            <button class="btn-game btn-action" onclick="gantiGiliran()">Lanjut ke Tim Lawan</button>
        </div>
    </div>

    <script>
        // ==========================================
        // BANK SOAL (Atur waktuUtama & waktuRebut di sini)
        // ==========================================
        const bankSoal = [
            {
                soal: "Sebutkan istilah yang berkaitan dengan genetika!",
                waktuUtama: 30, waktuRebut: 15,
                jawaban: [
                    { teks: "Gen", poin: 30 }, { teks: "DNA", poin: 25 },
                    { teks: "Kromosom", poin: 20 }, { teks: "Alel", poin: 15 },
                    { teks: "Genotipe", poin: 10 }
                ]
            },
            {
                soal: "Sebutkan contoh sifat yang diwariskan dari orang tua!",
                waktuUtama: 40, waktuRebut: 20,
                jawaban: [
                    { teks: "Golongan darah", poin: 30 }, { teks: "Warna mata", poin: 25 },
                    { teks: "Bentuk rambut", poin: 20 }, { teks: "Warna kulit", poin: 15 },
                    { teks: "Bentuk cuping telinga", poin: 10 }
                ]
            }
        ];

        let soalSekarang = null;
        let skorA = 0, skorB = 0;
        let strikes = 0;
        let timMulai = 'A'; 
        let timGiliran = 'A';
        let namaTimA = "TIM A", namaTimB = "TIM B";
        
        let timerInterval;
        let waktuTersisa = 0;
        let modeRebut = false;
        let jawabanTerbuka = 0;

        // --- FUNGSI DADU ---
        function rollDice() {
            document.getElementById('roll-btn').disabled = true;
            let dice = document.getElementById('dice-main');
            dice.classList.add('rolling');

            namaTimA = document.getElementById('input-name-a').value || "TIM A";
            namaTimB = document.getElementById('input-name-b').value || "TIM B";

            let count = 0;
            let interval = setInterval(() => {
                dice.innerText = Math.floor(Math.random() * 6) + 1;
                count++;
                if (count > 15) {
                    clearInterval(interval);
                    tentukanPemenangDadu(parseInt(dice.innerText));
                }
            }, 100);
        }

        function tentukanPemenangDadu(angka) {
            document.getElementById('dice-main').classList.remove('rolling');
            
            let isGanjil = (angka % 2 !== 0);
            timMulai = isGanjil ? 'A' : 'B';
            timGiliran = timMulai;

            let namaPemenang = isGanjil ? namaTimA : namaTimB;

            setTimeout(() => {
                document.getElementById('jeda-title').innerText = `${namaPemenang} MAIN DULU!`;
                document.getElementById('modal-jeda').classList.add('active');
            }, 500);
        }

        function startGame() {
            document.getElementById('modal-jeda').classList.remove('active');
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            document.getElementById('display-name-a').innerText = namaTimA;
            document.getElementById('display-name-b').innerText = namaTimB;

            loadNextQuestion();
        }

        // --- LOGIKA GAME ---
        function loadNextQuestion() {
            clearInterval(timerInterval);
            modeRebut = false;
            timGiliran = timMulai; 
            jawabanTerbuka = 0;
            strikes = 0;
            document.getElementById('strikes-display').classList.remove('active');
            
            // Disable input sampai tombol "Tampilkan Soal" ditekan
            document.getElementById('input-jawaban').disabled = true;
            document.getElementById('btn-submit').disabled = true;
            document.getElementById('input-jawaban').value = '';
            
            // Tampilkan tombol show question
            document.getElementById('btn-show-q').style.display = 'inline-block';
            document.getElementById('btn-show-q').disabled = false;
            document.getElementById('btn-show-q').innerText = 'Tampilkan Soal & Mulai Waktu';

            // Ambil soal
            const randomIndex = Math.floor(Math.random() * bankSoal.length);
            soalSekarang = bankSoal[randomIndex];

            // Sembunyikan teks soal
            document.getElementById('question-text').innerText = "Soal disembunyikan. Host klik tombol di bawah untuk memulai.";
            document.getElementById('timer-display').innerText = soalSekarang.waktuUtama;
            
            const container = document.getElementById('answers-container');
            container.innerHTML = '';
            
            soalSekarang.jawaban.forEach((item, index) => {
                const answerDiv = document.createElement('div');
                answerDiv.className = 'answer-item';
                answerDiv.id = `answer-${index}`; // Beri ID unik untuk manipulasi
                answerDiv.innerHTML = `
                    <div class="answer-rank">${index + 1}</div>
                    <div class="answer-content hidden-box">? ? ? ? ?</div>
                    <div class="answer-points">${item.poin}</div>
                `;
                container.appendChild(answerDiv);
            });

            updateTurnUI();
        }

        function tampilkanSoal() {
            document.getElementById('question-text').innerText = soalSekarang.soal;
            
            // Aktifkan input
            document.getElementById('input-jawaban').disabled = false;
            document.getElementById('btn-submit').disabled = false;
            document.getElementById('input-jawaban').focus();

            // Sembunyikan tombol tampilkan soal
            document.getElementById('btn-show-q').style.display = 'none';

            // Mulai Timer
            mulaiTimer(soalSekarang.waktuUtama);
        }

        function updateTurnUI() {
            let timSekarang = (timGiliran === 'A') ? namaTimA : namaTimB;
            let text = modeRebut ? `KESEMPATAN KEDUA: ${timSekarang}` : `GILIRAN: ${timSekarang}`;
            document.getElementById('turn-display').innerText = text;
            
            if (timGiliran === 'A') {
                document.getElementById('team-box-a').classList.add('active-turn');
                document.getElementById('team-box-b').classList.remove('active-turn');
            } else {
                document.getElementById('team-box-b').classList.add('active-turn');
                document.getElementById('team-box-a').classList.remove('active-turn');
            }
        }

        function mulaiTimer(detik) {
            waktuTersisa = detik;
            document.getElementById('timer-display').innerText = waktuTersisa;
            clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                waktuTersisa--;
                document.getElementById('timer-display').innerText = waktuTersisa;
                
                if (waktuTersisa <= 0) {
                    clearInterval(timerInterval);
                    waktuHabis();
                }
            }, 1000);
        }

        function waktuHabis() {
            document.getElementById('input-jawaban').disabled = true;
            document.getElementById('btn-submit').disabled = true;
            
            if (jawabanTerbuka < soalSekarang.jawaban.length) {
                document.getElementById('modal-waktu').classList.add('active');
            } else {
                beriPoinDanLanjut();
            }
        }

        function gantiGiliran() {
            document.getElementById('modal-waktu').classList.remove('active');
            
            if (!modeRebut) {
                modeRebut = true;
                timGiliran = (timGiliran === 'A') ? 'B' : 'A';
                document.getElementById('input-jawaban').disabled = false;
                document.getElementById('btn-submit').disabled = false;
                document.getElementById('input-jawaban').focus();
                updateTurnUI();
                mulaiTimer(soalSekarang.waktuRebut || 15);
            } else {
                beriPoinDanLanjut();
            }
        }

        // FUNGSI YANG DIPERBAIKI UNTUK MENAMPILKAN JAWABAN
        function cekInputJawaban() {
            if (document.getElementById('input-jawaban').disabled) return;
            
            const input = document.getElementById('input-jawaban');
            const jawabanUser = input.value.toLowerCase().trim();
            if (!jawabanUser) return;

            let ketemu = false;

            soalSekarang.jawaban.forEach((item, index) => {
                const answerDiv = document.getElementById(`answer-${index}`);
                
                // Cek jika teks cocok DAN kotak belum dibuka
                if (item.teks.toLowerCase() === jawabanUser && !answerDiv.classList.contains('revealed')) {
                    answerDiv.classList.add('revealed');
                    
                    // GANTI TEKS ? DENGAN TEKS ASLI
                    const contentDiv = answerDiv.querySelector('.answer-content');
                    contentDiv.classList.remove('hidden-box');
                    contentDiv.innerText = item.teks;
                    
                    jawabanTerbuka++;
                    ketemu = true;
                }
            });

            if (ketemu) {
                input.value = ''; 
                if (jawabanTerbuka === soalSekarang.jawaban.length) {
                    clearInterval(timerInterval);
                    beriPoinDanLanjut();
                }
            } else {
                tambahXManual();
                input.value = '';
            }
        }

        function tambahXManual() {
            strikes++;
            document.getElementById('strikes-display').classList.add('active');
            setTimeout(() => {
                document.getElementById('strikes-display').classList.remove('active');
            }, 1500);
            if (strikes >= 3) {
                clearInterval(timerInterval);
                waktuHabis();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') cekInputJawaban();
        }

        function beriPoinDanLanjut() {
            let totalPoin = 0;
            
            // Hitung poin dari jawaban yang terbuka
            soalSekarang.jawaban.forEach((item, index) => {
                const answerDiv = document.getElementById(`answer-${index}`);
                if (answerDiv.classList.contains('revealed')) {
                    totalPoin += item.poin;
                }
            });

            if (timGiliran === 'A') {
                skorA += totalPoin;
                document.getElementById('score-a').innerText = skorA;
            } else {
                skorB += totalPoin;
                document.getElementById('score-b').innerText = skorB;
            }

            setTimeout(() => {
                alert(`Poin ${totalPoin} diberikan ke tim yang menjawab! Lanjut ke soal berikutnya.`);
                loadNextQuestion();
            }, 500);
        }

        // --- Logika Layar Penuh ---
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                fullscreenBtn.innerText = '🗗';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.innerText = '⛶';
                }
            }
        });
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) fullscreenBtn.innerText = '⛶';
        });
    </script>
</body>
</html>
