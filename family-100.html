<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari Belajar - Family 100</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #eef7ee; 
            font-family: 'Patrick Hand', cursive;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #1a2e1a; overflow: hidden; position: relative;
        }
        
        /* Latar Belakang Biologi */
        .bio-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; opacity: 0.1;
            font-family: 'Permanent Marker', cursive; font-size: 3rem; color: #2e7d32; pointer-events: none;
        }
        .floating-element { position: absolute; animation: float 10s infinite ease-in-out alternate; }
        @keyframes float { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-30px) rotate(15deg); } }
        .el-1 { top: 10%; left: 10%; } .el-2 { top: 20%; right: 15%; animation-delay: 2s; }
        .el-3 { bottom: 15%; left: 15%; animation-delay: 1s; } .el-4 { bottom: 25%; right: 10%; animation-delay: 3s; }

        /* Header Kontrol */
        .top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 10; }
        .icon-btn {
            background-color: white; border: 3px solid #1b5e20; border-radius: 50%; 
            width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 2px 2px 0px #81c784; transition: all 0.2s ease;
        }
        .icon-btn:hover { background-color: #e8f5e9; transform: translateY(-2px); }

        /* ================= DESAIN GAME FAMILY 100 ================= */
        .game-container {
            width: 95%; max-width: 900px; background-color: #0d1b2a; /* Latar gelap khas Family 100 */
            border: 5px solid #f57c00; border-radius: 20px; padding: 20px;
            box-shadow: 0 0 20px rgba(245, 124, 0, 0.5); display: flex; flex-direction: column; align-items: center;
            z-index: 1; color: white; position: relative;
        }

        .game-header {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            margin-bottom: 20px; border-bottom: 2px solid #1b263b; padding-bottom: 10px;
        }

        .game-title {
            font-family: 'Permanent Marker', cursive; font-size: 2.5rem; color: #fbc02d;
            text-shadow: 2px 2px 0px #b71c1c;
        }

        .score-box {
            background-color: #1b263b; padding: 10px 20px; border-radius: 10px;
            border: 2px solid #fbc02d; font-size: 2rem; font-weight: bold; color: #fbc02d;
        }

        /* Papan Pertanyaan */
        .question-board {
            background-color: #1b263b; width: 100%; text-align: center; padding: 15px;
            border-radius: 10px; font-size: 1.5rem; margin-bottom: 20px; border: 2px solid #415a77;
            min-height: 80px; display: flex; justify-content: center; align-items: center;
        }

        /* Daftar Jawaban */
        .answers-list {
            display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 20px;
        }

        .answer-item {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #1b263b; border: 2px solid #415a77; border-radius: 10px;
            padding: 15px 20px; font-size: 1.5rem; cursor: pointer; transition: all 0.2s;
            position: relative; overflow: hidden;
        }

        .answer-item:hover {
            background-color: #2b3a4a;
        }

        /* Efek saat jawaban dibuka (Reveal) */
        .answer-item.revealed {
            background-color: #0d47a1; border-color: #64b5f6; cursor: default;
        }
        .answer-item.revealed .answer-text { opacity: 1; }
        .answer-item.revealed .answer-points { opacity: 1; }
        
        .answer-text {
            opacity: 0.3; transition: opacity 0.3s; text-align: left; font-weight: bold;
        }
        .answer-points {
            opacity: 0.3; transition: opacity 0.3s; font-weight: bold; color: #fbc02d; font-size: 1.8rem;
        }

        /* Kontrol Game */
        .game-controls {
            display: flex; gap: 15px; margin-top: 10px; width: 100%; justify-content: center;
        }

        .btn-game {
            font-family: 'Patrick Hand', cursive; font-size: 1.5rem; font-weight: bold;
            padding: 10px 25px; border-radius: 8px; cursor: pointer; border: none;
            transition: all 0.2s; box-shadow: 0 4px 0 rgba(0,0,0,0.5);
        }
        .btn-game:active { transform: translateY(4px); box-shadow: none; }

        .btn-reset { background-color: #c62828; color: white; }
        .btn-reset:hover { background-color: #e53935; }

        .btn-next { background-color: #fbc02d; color: #1a2e1a; }
        .btn-next:hover { background-color: #fdd835; }

        .btn-exit { background-color: #546e7a; color: white; }
        .btn-exit:hover { background-color: #78909c; }

        /* --- POP-UP (MODAL) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5);
            display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background-color: #fff; border: 4px solid #1b5e20; border-radius: 10px; padding: 25px;
            width: 90%; max-width: 450px; text-align: center; box-shadow: 8px 8px 0px #81c784;
            position: relative; transform: translateY(-20px); transition: all 0.3s ease; color: #1a2e1a;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: #1b5e20; font-weight: bold; }
        .modal-title { font-size: 2rem; color: #1b5e20; margin-bottom: 15px; border-bottom: 2px dashed #81c784; padding-bottom: 10px; }
    </style>
</head>
<body>
    <div class="bio-background">
        <div class="floating-element el-1">A</div><div class="floating-element el-2">T</div>
        <div class="floating-element el-3">C</div><div class="floating-element el-4">G</div>
    </div>

    <audio id="bg-music" loop><source src="lagu.mp3" type="audio/mpeg"></audio>

    <div class="top-controls">
        <button class="icon-btn" id="mute-btn">🔊</button>
    </div>

    <!-- ================= GAME FAMILY 100 ================= -->
    <div class="game-container">
        <div class="game-header">
            <button class="btn-game btn-exit" onclick="window.location.href='index.html'">⬅ Keluar</button>
            <h1 class="game-title">FAMILY 100</h1>
            <div class="score-box">SCORE: <span id="score-display">0</span></div>
        </div>

        <div class="question-board" id="question-text">
            (Pertanyaan akan muncul di sini)
        </div>

        <div class="answers-list">
            <div class="answer-item" onclick="revealAnswer(this, 30)">
                <span class="answer-text">Jawaban 1</span>
                <span class="answer-points">30</span>
            </div>
            <div class="answer-item" onclick="revealAnswer(this, 25)">
                <span class="answer-text">Jawaban 2</span>
                <span class="answer-points">25</span>
            </div>
            <div class="answer-item" onclick="revealAnswer(this, 20)">
                <span class="answer-text">Jawaban 3</span>
                <span class="answer-points">20</span>
            </div>
            <div class="answer-item" onclick="revealAnswer(this, 15)">
                <span class="answer-text">Jawaban 4</span>
                <span class="answer-points">15</span>
            </div>
            <div class="answer-item" onclick="revealAnswer(this, 10)">
                <span class="answer-text">Jawaban 5</span>
                <span class="answer-points">10</span>
            </div>
        </div>

        <div class="game-controls">
            <button class="btn-game btn-reset" onclick="resetGame()">Reset Game</button>
            <button class="btn-game btn-next" onclick="alert('Fitur ganti soal akan dibuat nanti!')">Soal Baru</button>
        </div>
    </div>

    <script>
        // --- 1. Logika Musik & Mute ---
        const muteBtn = document.getElementById('mute-btn');
        const bgMusic = document.getElementById('bg-music');
        let isMuted = false;

        document.body.addEventListener('click', function playMusic() {
            if(bgMusic.paused) bgMusic.play().catch(e => console.log("Menunggu interaksi user."));
            document.body.removeEventListener('click', playMusic);
        });

        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            bgMusic.muted = !bgMusic.muted;
            muteBtn.innerText = bgMusic.muted ? '🔇' : '🔊';
        });

        // --- 2. Logika Game Family 100 ---
        let currentScore = 0;

        function revealAnswer(element, points) {
            if (element.classList.contains('revealed')) return;
            element.classList.add('revealed');
            currentScore += points;
            document.getElementById('score-display').innerText = currentScore;
        }

        function resetGame() {
            const answers = document.querySelectorAll('.answer-item');
            answers.forEach(item => {
                item.classList.remove('revealed');
            });
            currentScore = 0;
            document.getElementById('score-display').innerText = currentScore;
            document.getElementById('question-text').innerText = "(Pertanyaan akan muncul di sini)";
        }
    </script>
</body>
</html>
